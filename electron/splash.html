<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:500px; height:300px;
    background: linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:'Segoe UI',sans-serif; color:#fff;
    border-radius:12px; overflow:hidden;
    -webkit-app-region:drag;
  }
  .logo { font-size:48px; margin-bottom:12px; }
  h1 { font-size:22px; font-weight:700; letter-spacing:1px; margin-bottom:4px; }
  p  { font-size:13px; color:#94a3b8; margin-bottom:32px; }
  .bar-wrap {
    width:260px; height:4px; background:rgba(255,255,255,.1);
    border-radius:2px; overflow:hidden;
  }
  .bar {
    height:100%; width:30%;
    background:linear-gradient(90deg,#e94560,#f57c00);
    border-radius:2px;
    animation:slide 1.4s ease-in-out infinite;
  }
  .status { margin-top:14px; font-size:12px; color:#64748b; }
  @keyframes slide {
    0%   { transform:translateX(-100%); }
    100% { transform:translateX(1000%); }
  }
</style>
</head>
<body>
  <div class="logo">🍽️</div>
  <h1>Restaurant POS</h1>
  <p>Starting services, please wait…</p>
  <div class="bar-wrap"><div class="bar"></div></div>
  <div class="status">Initializing database &amp; backend…</div>
</body>
</html>
